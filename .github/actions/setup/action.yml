name: Setup
description: Install Node.js (the version pinned in .nvmrc), pnpm and the locked dependencies

runs:
  using: composite
  steps:
    # the pnpm version comes from "packageManager" in package.json
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
