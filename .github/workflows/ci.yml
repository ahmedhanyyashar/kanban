name: CI

on:
  push:
    branches: [main]
  pull_request:

# a read-only token: no job here pushes, comments or publishes anything
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `prisma generate` reads this but never connects; the end-to-end jobs start their own database
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanban

jobs:
  # Text-only changes (Markdown and docs/) skip the slow jobs. A job skipped by its `if` counts as
  # passed for the required checks, while a workflow-level `paths-ignore` would leave them unreported
  # and block the pull request. `lint` still runs, so the Markdown is format-checked.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # when the range cannot be read (a new branch, a force push), assume code
          if git diff --name-only "$BASE...$HEAD" > changed.txt 2>/dev/null; then
            if grep -qvE '\.md$|^docs/' changed.txt; then code=true; else code=false; fi
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run lint
      - run: pnpm format:check
      - run: pnpm docs:check

  check-types:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run check-types

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test

  build:
    needs: [changes, lint, check-types, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build

  # Pull requests are rebase-merged, so every commit lands on main as written: each message is checked.
  # The OpenAPI document and the client types are committed; a controller change that did not regenerate them fails here.
  api-contract:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm api:generate
      - name: The committed API contract is current
        run: git diff --exit-code -- docs/openapi.json packages/api-client/src/generated

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
