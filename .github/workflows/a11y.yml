name: Accessibility

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # the app imports the built workspace packages
      - run: pnpm build:libs
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      # these pages need no API, so none is started
      - run: pnpm --filter web exec playwright test e2e/a11y.spec.ts --project=chromium
        env:
          E2E_API: "off"
