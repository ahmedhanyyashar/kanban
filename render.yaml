# The whole app on Render: one service whose API also serves the web app, so both share one address.
# The database is Neon: set DATABASE_URL in the dashboard when the service is created.
services:
  - type: web
    name: kanban
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    # a commit goes live once its checks have passed on GitHub
    autoDeployTrigger: checksPass
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # optional: without it the AI features answer that they are not configured
      - key: LLM_API_KEY
        sync: false
